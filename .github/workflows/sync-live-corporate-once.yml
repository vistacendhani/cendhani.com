name: Sync live corporate page once

on:
  push:
    paths:
      - '.github/workflows/sync-live-corporate-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch live corporate page
        run: |
          mkdir -p corporate
          curl -fsSL https://cendhani.com/corporate/ -o corporate/index.html

      - name: Commit synced page and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/sync-live-corporate-once.yml
          git add corporate/index.html .github/workflows/sync-live-corporate-once.yml
          if git diff --cached --quiet; then
            echo "Nothing to sync"
            exit 0
          fi
          git commit -m "Sync live corporate landing page"
          git push origin HEAD:main
